[project]
name = "guardiano"
dynamic = ["version"]
description = "Guardiano - application vulnerability management for SAST and SCA findings"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.159.1",
    "uvicorn[standard]>=0.30",
    "gunicorn>=23.0",
    "sqlalchemy==2.1.6",
    "psycopg[binary]>=3.2",
    "pydantic==2.14.1",
    "pydantic-settings>=2.7",
    "argon2-cffi>=23.1",
    "pyjwt>=2.15.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "httpcore==1.0.9",  # validated network backend for outbound dispatch
    "httpx>=0.27",  # outbound webhooks (services/webhooks.py)
    "cryptography>=43",  # encrypts issue-tracker credentials at rest (core/crypto.py)
    "alembic>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.package-data]
"app.migrations" = ["*.json"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["B008", "S101", "S105", "S106", "S311", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/services/seed.py"]

[tool.coverage.report]
fail_under = 80
skip_empty = true

[tool.pytest.ini_options]
markers = ["no_database: pure tests that must run without PostgreSQL"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore:Using `httpx`",
]
