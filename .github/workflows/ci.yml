name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://guardiano:guardiano@localhost:5432/guardiano_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guardiano
          POSTGRES_PASSWORD: guardiano
          POSTGRES_DB: guardiano_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guardiano -d guardiano_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Install dependency contract checker
        run: python -m pip install uv==0.11.19
      - name: Check dependency and API contracts
        run: python check_contracts.py
      - name: Lint
        run: ruff check .
      - name: Check OpenAPI contract
        run: |
          python -m app.cli openapi - > "$RUNNER_TEMP/openapi.json"
          diff -u ../frontend/src/api/openapi.json "$RUNNER_TEMP/openapi.json"
      - name: Test with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=junit.xml
      - name: Retain test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: backend-results
          path: |
            backend/coverage.xml
            backend/junit.xml
          retention-days: 7

  frontend:
    name: Frontend and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      BROWSER_DATABASE_URL: postgresql+psycopg://guardiano:guardiano@localhost:5432/guardiano_browser_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guardiano
          POSTGRES_PASSWORD: guardiano
          POSTGRES_DB: guardiano_browser_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guardiano -d guardiano_browser_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Check generated API types
        run: |
          pnpm test:api
          pnpm gen:api
          git diff --exit-code -- src/api/schema.d.ts
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Prepare browser test backend
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-dev.lock
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser and accessibility tests
        run: pnpm test:browser
      - name: Retain failed browser traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-results
          path: frontend/test-results/
          retention-days: 7

  containers:
    name: Production containers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build production images
        run: docker compose build backend frontend
