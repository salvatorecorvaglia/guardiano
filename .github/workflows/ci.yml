name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://guardiano:guardiano@localhost:5432/guardiano_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guardiano
          POSTGRES_PASSWORD: guardiano
          POSTGRES_DB: guardiano_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guardiano -d guardiano_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Check backend and frontend versions agree
        run: |
          python - <<'PYTHON'
          import ast
          import json
          from pathlib import Path

          module = ast.parse(Path('app/__init__.py').read_text())
          backend = next(
              ast.literal_eval(node.value)
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == '__version__' for target in node.targets)
          )
          frontend = json.loads(Path('../frontend/package.json').read_text())['version']
          if backend != frontend:
              raise SystemExit(f'Version mismatch: backend {backend}, frontend {frontend}')
          PYTHON
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Install dependency contract checker
        run: python -m pip install uv==0.11.19
      - name: Check dependency and API contracts
        run: python check_contracts.py
      - name: Audit locked production dependencies
        run: |
          uv tool run pip-audit==2.10.1 --disable-pip --no-deps -r requirements.lock
      - name: Lint
        run: ruff check .
      - name: Check OpenAPI contract
        run: |
          python -m app.cli openapi - > "$RUNNER_TEMP/openapi.json"
          diff -u ../frontend/src/api/openapi.json "$RUNNER_TEMP/openapi.json"
      - name: Test with coverage
        run: pytest --durations=30 --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=junit.xml
      - name: Retain test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: backend-results
          path: |
            backend/coverage.xml
            backend/junit.xml
          retention-days: 7

  frontend:
    name: Frontend and browser tests
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
        shell: bash
    env:
      BROWSER_DATABASE_URL: postgresql+psycopg://guardiano:guardiano@postgres:5432/guardiano_browser_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guardiano
          POSTGRES_PASSWORD: guardiano
          POSTGRES_DB: guardiano_browser_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guardiano -d guardiano_browser_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Check generated API types
        run: |
          pnpm test:api
          cp src/api/schema.d.ts "$RUNNER_TEMP/schema.d.ts"
          pnpm gen:api
          diff -u "$RUNNER_TEMP/schema.d.ts" src/api/schema.d.ts
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        env:
          AGENT_TOOLSDIRECTORY: /opt/hostedtoolcache
          RUNNER_TOOL_CACHE: /opt/hostedtoolcache
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Prepare browser test backend
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-dev.lock
      - name: Check Playwright matches the browser image
        run: test "$(node -p 'require("@playwright/test/package.json").version')" = "1.64.1"
      - name: Browser and accessibility tests
        run: pnpm test:browser
      - name: Retain failed browser traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-results
          path: frontend/test-results/
          retention-days: 7

  containers:
    name: Production containers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Operational safety tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build production images
        run: docker compose build db backend frontend

      - name: Audit production container images
        run: python3 scripts/image-audit.py --image guardiano/backend:latest --image guardiano/frontend:latest --image guardiano/db:latest --output-dir image-audit
      - name: Retain full container vulnerability reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: container-vulnerability-reports
          path: image-audit/
          retention-days: 30
      - name: Exercise production startup, MFA, ingestion and encrypted restore
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/production.py --env-file .env.production init-env
          cat >> .env.production <<'ENV'
          PUBLIC_URL=https://guardiano.example.test
          INTEL_SYNC_ENABLED=false
          HTTP_PORT=18080
          ENV
          python3 scripts/production.py --env-file .env.production preflight --allow-local-build
          docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.production.yml up -d --no-build --wait --wait-timeout 180
          python3 scripts/staging-smoke.py --env-file .env.production --url http://127.0.0.1:18080 --disposable-staging
          umask 077
          openssl rand -hex 32 > "$RUNNER_TEMP/backup.key"
          python3 scripts/production.py --env-file .env.production backup "$RUNNER_TEMP/guardiano.dump.enc" --key-file "$RUNNER_TEMP/backup.key"
          python3 scripts/production.py --env-file .env.production restore-drill "$RUNNER_TEMP/guardiano.dump.enc" --key-file "$RUNNER_TEMP/backup.key" --application-check
      - name: Save verified release images
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker save guardiano/backend:latest guardiano/frontend:latest guardiano/db:latest | gzip > "$RUNNER_TEMP/production-images.tar.gz"
      - name: Retain verified release images
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: production-images
          path: ${{ runner.temp }}/production-images.tar.gz
          retention-days: 7
      - name: Production stack diagnostics
        if: failure()
        shell: bash
        run: |
          if [ ! -f .env.production ]; then
            echo 'No production env file was created; the stack never started.'
            exit 0
          fi
          docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.production.yml logs --tail 100
      - name: Clean up disposable production stack
        if: always()
        shell: bash
        run: |
          if [ -f .env.production ]; then
            docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.production.yml down -v
          else
            docker compose -f docker-compose.yml down -v
          fi
