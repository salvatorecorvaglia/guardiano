# Included in every location: nginx add_header does not inherit into a block that sets its own,
# so a location without this include would answer with no security headers at all.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# The same policy for pages, static assets and API responses: a JSON body is not a page, but
# a browser can still be talked into rendering one, and there is nothing to relax for it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# Belt and braces behind a TLS terminator that should already send it. max-age is two years;
# no includeSubDomains, since Guardiano does not own what else is on the parent domain.
add_header Strict-Transport-Security "max-age=63072000" always;
